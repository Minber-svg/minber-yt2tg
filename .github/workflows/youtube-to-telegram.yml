name: YouTube → Telegram

on:
  schedule:
    - cron: "*/15 * * * *"   # әр 15 минут сайын (GitHub кейде бірнеше минут кешіктіреді)
  workflow_dispatch: {}       # Actions бетінен қолмен іске қосу

permissions:
  contents: write             # posted.json файлын репозиторийге сақтау үшін

concurrency:
  group: yt2tg
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Жаңа видеоларды жариялау
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          INCLUDE_SHORTS: ${{ vars.INCLUDE_SHORTS || 'true' }}
        run: python bot.py

      - name: Күйді сақтау (posted.json)
        if: always()
        run: |
          git config user.name  "minber-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posted.json
          git diff --cached --quiet || (git commit -m "Update posted videos [skip ci]" && git push)
